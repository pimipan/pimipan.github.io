<!doctype html>
<html lang="{{ page.language | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071114">
  <meta name="color-scheme" content="dark">
  <title>{% if page.share-title %}{{ page.share-title }}{% elsif page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fm-blueprint.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/avatar-icon.png' | relative_url }}">
  <meta property="og:type" content="{% if page.layout == 'fm_post' %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.share-title | default: page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.share-img | default: site.default-share-img | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.share-title | default: page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">
  <meta name="twitter:image" content="{{ page.share-img | default: site.default-share-img | absolute_url }}">
  {% if page.math %}
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]},svg:{fontCache:'global'}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  {% endif %}
</head>
<body class="page-{{ page.nav-key | default: 'default' }}">
  {% include fm-nav.html %}
  <main id="main-content">
    {{ content }}
  </main>
  {% include fm-footer.html %}
  <script src="{{ '/assets/js/fm-site.js' | relative_url }}" defer></script>
</body>
</html>
