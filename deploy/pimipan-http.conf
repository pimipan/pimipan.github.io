server {
    listen 80;
    listen [::]:80;
    server_name pimipan.work www.pimipan.work;
    root /var/www/pimipan/current;
    index index.html;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    include /etc/nginx/snippets/pimipan-http-mode.conf;
}

# Stable loopback endpoint for deployment checks, independent of TLS/DNS.
server {
    listen 127.0.0.1:8080;
    server_name pimipan.work;
    root /var/www/pimipan/current;
    index index.html;
    include /etc/nginx/snippets/pimipan-static.conf;
}
