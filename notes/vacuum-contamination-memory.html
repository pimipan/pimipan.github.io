<script>
(() => {
  const chips = [...document.querySelectorAll('[data-select]')];
  const lanes = [...document.querySelectorAll('.svg-lane')];
  const paths = [...document.querySelectorAll('.path-group')];
  function select(id) {
    [...lanes, ...paths].forEach(element => {
      element.classList.toggle('dim', id !== 'all' && element.dataset.id !== id);
    });
    chips.forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.select === id));
    });
  }
  chips.forEach(button => button.addEventListener('click', () => select(button.dataset.select)));
  lanes.forEach(lane => {
    lane.addEventListener('click', () => select(lane.dataset.id));
    lane.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        select(lane.dataset.id);
      }
    });
  });
  select('all');
})();
</script>
